name: Bug report
description: Report a bug in Lutra
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong
      placeholder: 'The LUT layer renders black when stacked after Clarity…'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce, ideally with a minimal photo / edit setup
      placeholder: |
        1. Open a photo…
        2. Add LUT layer with…
        3. Adjust exposure to…
        4. See that…
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: 'The preview matches the exported image.'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include screenshots or recordings if helpful
      placeholder: 'Preview goes black. No error in console.'
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / environment
      description: Browser, OS, GPU where the bug occurs (WebGPU behavior varies by adapter)
      placeholder: 'Chrome 126 on macOS 15, Apple M1, Node 22'
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (logs, links, workarounds, layer stack)
      render: text
    validations:
      required: false
