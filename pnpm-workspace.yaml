packages:
  - 'packages/*'
# Foldkit pins `effect` to the exact 4.0.0 stable release. The 4.0.x patch
# line is compatible (its packages only use stable Effect APIs), so track the
# latest patch instead of freezing on 4.0.0 and let the peer check accept it.
peerDependencyRules:
  allowedVersions:
    effect: '^4.0.0'
allowBuilds:
  lefthook: true
  msgpackr-extract: true
  workerd: true
# Alchemy publishes its provider packages in lockstep with the core package;
# an exclude per package keeps a fresh beta installable before the
# minimum-release-age window passes.
minimumReleaseAgeExclude:
  - '@alchemy.run/cloudflare@2.0.0-beta.84'
  - '@alchemy.run/cloudflare-runtime@2.0.0-beta.84'
  - '@alchemy.run/floci@2.0.0-beta.84'
  - '@alchemy.run/node-utils@2.0.0-beta.84'
  - alchemy@2.0.0-beta.84
